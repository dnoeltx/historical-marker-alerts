# Releases are deliberate: pushing a tag like v1.0.0 is what ships a build.
#
# Ported from ChecklistV1, where this workflow is known to work, with two
# changes this repo needs:
#   - unit tests name both modules, because a bare `testDebugUnitTest` would
#     silently skip every :tools test (same reasoning as ci.yml)
#   - the artifact is named after this app
#
# Action versions match ci.yml, verified against the live GitHub API 2026-08-18.
name: Release

on:
  push:
    tags:
      - 'v*'

# Unlike CI, this job must write — it creates a GitHub Release and uploads the
# APK to it. Still the minimum needed, nothing more.
permissions:
  contents: write

jobs:
  release:
    name: Build & publish signed APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # Fail immediately with a clear message rather than part-way through a
      # build with a confusing signing error.
      - name: Check required secrets are present
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          missing=""
          [ -z "$KEYSTORE_BASE64" ]   && missing="$missing KEYSTORE_BASE64"
          [ -z "$KEYSTORE_PASSWORD" ] && missing="$missing KEYSTORE_PASSWORD"
          [ -z "$KEY_ALIAS" ]         && missing="$missing KEY_ALIAS"
          [ -z "$KEY_PASSWORD" ]      && missing="$missing KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing"
            exit 1
          fi

      # v1.2.0 -> versionName 1.2.0, versionCode 10200.
      # Deriving the code arithmetically keeps it monotonic and reproducible:
      # rebuilding the same tag always produces the same versionCode.
      - name: Derive version from tag
        id: version
        run: |
          TAG="${GITHUB_REF_NAME}"
          NAME="${TAG#v}"
          if ! echo "$NAME" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Tag '$TAG' is not of the form vMAJOR.MINOR.PATCH (e.g. v1.0.0)"
            exit 1
          fi
          MAJOR="${NAME%%.*}"
          REST="${NAME#*.}"
          MINOR="${REST%%.*}"
          PATCH="${REST#*.}"
          CODE=$(( MAJOR * 10000 + MINOR * 100 + PATCH ))
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "Building versionName=$NAME versionCode=$CODE"

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          # Sanity check: a truncated or mis-encoded secret produces a tiny file.
          test -s "$RUNNER_TEMP/release.jks"

      # Both modules named explicitly, exactly as in ci.yml. AGP only generates
      # unit-test tasks for the debug variant, so there is no
      # testReleaseUnitTest — using the same tasks CI uses means a green CI run
      # genuinely predicts a green release.
      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest :tools:test --console=plain

      - name: Build signed release APK
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew :app:assembleRelease --console=plain \
            -PappVersionName=${{ steps.version.outputs.name }} \
            -PappVersionCode=${{ steps.version.outputs.code }}

      # Proves the APK really is signed with the release key rather than
      # silently falling back to debug signing. An unsigned build would be named
      # app-release-unsigned.apk, so the path check catches that too.
      - name: Verify the APK is signed
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          if [ ! -f "$APK" ]; then
            echo "::error::Expected $APK. Contents of the release output dir:"
            ls -la app/build/outputs/apk/release/ || true
            exit 1
          fi
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner 2>/dev/null | sort -V | tail -1)
          if [ -z "$APKSIGNER" ]; then
            echo "::error::apksigner not found under $ANDROID_HOME/build-tools"
            exit 1
          fi
          "$APKSIGNER" verify --verbose --print-certs "$APK"

      # The prebuilt marker database ships inside the APK, so a release that
      # somehow lost the asset would install and then find nothing to alert
      # about. Cheap to check here, impossible to notice until the drive.
      - name: Verify the marker database shipped
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          if ! unzip -l "$APK" | grep -q 'assets/markers.db'; then
            echo "::error::markers.db is not in the APK — the app would have no data"
            exit 1
          fi
          unzip -l "$APK" | grep 'assets/markers.db'

      - name: Name the artifact after the version
        id: artifact
        run: |
          OUT="marker-alerts-${{ steps.version.outputs.name }}.apk"
          mv app/build/outputs/apk/release/app-release.apk "$OUT"
          echo "path=$OUT" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "${{ steps.artifact.outputs.path }}" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes

      # The runner is ephemeral, but never leave a keystore lying around.
      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
