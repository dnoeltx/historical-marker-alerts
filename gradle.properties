# Project-wide Gradle settings.
# Settings configured through the IDE will override anything specified here.

org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Skip the configuration phase entirely when nothing affecting it has changed.
org.gradle.configuration-cache=true

kotlin.code.style=official

# KSP registers generated sources through the kotlin.sourceSets DSL, which
# conflicts with AGP 9's built-in Kotlin compilation. Without this the build
# fails outright with a "kotlin.sourceSets DSL" error — it is not an
# optimization, it is load-bearing. Carried over from ChecklistV1.
android.disallowKotlinSourceSets=false
